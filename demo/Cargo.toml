[package]
name = "demo"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Live camera demos for rtmpose"

[[bin]]
name = "camera-pose-rtm"
path = "src/bin/pose_rtm.rs"

[[bin]]
name = "camera-pose-rtmw"
path = "src/bin/pose_rtmw.rs"

[dependencies]
rtmpose = { path = ".." }
anyhow = "1.0.100"
eframe = "0.32.3"
egui = "0.32.3"
nokhwa = { version = "^0.10.9", features = [
  "input-native",
  "output-threaded",
  "output-wgpu",
] }
image = "0.25.8"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
